<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mods</title>
<style>
  :root {
    --bg: #141a24;
    --bg-2: #1b2330;
    --card: #222b3a;
    --card-2: #2a3547;
    --border: #34415a;
    --text: #e8edf5;
    --muted: #93a2b8;
    --accent: #7c6cff;
    --accent-2: #5b4bd6;
    --ok: #4ade80;
    --star: #ffc94d;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(124, 108, 255, .15), transparent 60%),
      radial-gradient(900px 400px at 0% 0%, rgba(74, 222, 128, .08), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header */
  .site-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
    background: rgba(20, 26, 36, .85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
  }
  .site-title {
    font-size: 20px; font-weight: 800; letter-spacing: .5px;
    display: flex; align-items: center; gap: 10px;
  }
  .site-title .logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff;
  }
  .nav-links { display: flex; gap: 18px; font-size: 14px; color: var(--muted); }
  .nav-links a { color: var(--muted); }
  .nav-links a:hover { color: var(--text); }

  main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px 28px 48px; }

  /* Hero / banner */
  .hero {
    position: relative; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--border); margin-bottom: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .hero img { width: 100%; height: 380px; object-fit: cover; display: block; }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 30%, rgba(20,26,36,.97) 100%);
    display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 28px;
  }
  .hero h1 { font-size: 34px; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .hero .tagline { color: var(--muted); margin-top: 4px; font-size: 15px; }
  .hero .badges { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px;
    background: rgba(124,108,255,.18); color: var(--accent);
    border: 1px solid rgba(124,108,255,.4);
  }
  .badge.good { background: rgba(74,222,128,.12); color: var(--ok); border-color: rgba(74,222,128,.4); }

  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }

  /* Cards */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; margin-bottom: 20px;
  }
  .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .desc p { color: #c6d0e0; line-height: 1.7; margin-bottom: 12px; }
  .desc p:last-child { margin-bottom: 0; }

  .feature-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .feature-list li { color: #c6d0e0; font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
  .feature-list li::before { content: "✓"; color: var(--ok); font-weight: 700; }

  .install-list { list-style: none; counter-reset: inst; display: flex; flex-direction: column; gap: 14px; }
  .install-list li {
    counter-increment: inst; display: flex; gap: 14px; align-items: flex-start;
    color: #c6d0e0; font-size: 14px; line-height: 1.6;
  }
  .install-list li::before {
    content: counter(inst); flex-shrink: 0;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(124,108,255,.18); color: var(--accent);
    border: 1px solid rgba(124,108,255,.4);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; margin-top: 1px;
  }
  .install-list code {
    background: var(--card-2); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 5px; font-size: 13px; color: var(--text);
  }

  /* Screenshots */
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .shot {
    position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
    border: 1px solid var(--border); background: var(--card-2); aspect-ratio: 16/9;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
  .shot:hover img { transform: scale(1.05); }
  .shot::after {
    content: "🔍"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; font-size: 22px;
  }
  .shot:hover::after { opacity: 1; }

  /* Ratings + comments */
  .ratings-row { display: flex; gap: 28px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .score { text-align: center; }
  .score .num { font-size: 42px; font-weight: 800; line-height: 1; }
  .score .stars { color: var(--star); font-size: 16px; letter-spacing: 2px; margin-top: 4px; }
  .score .count { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .bars { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 5px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .bar-label { width: 20px; }
  .bar-track { flex: 1; height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--star); border-radius: 999px; }

  .comment { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--border); }
  .comment:first-of-type { border-top: none; padding-top: 0; }
  .comment .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: var(--card-2); border: 1px solid var(--border); overflow: hidden;
  }
  .comment .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .comment .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .comment .name { color: var(--accent); font-weight: 700; font-size: 14px; }
  .comment .body { color: #c6d0e0; font-size: 14px; line-height: 1.6; margin-top: 4px; }
  .comment .like { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .comment-form { display: flex; gap: 12px; margin-top: 18px; align-items: flex-start; }
  .comment-form .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--card-2); border: 1px solid var(--border); flex-shrink: 0; }
  .comment-form input, .comment-form textarea {
    width: 100%; background: var(--card-2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 10px 12px; font: inherit; font-size: 13px;
  }
  .comment-form textarea { min-height: 70px; resize: vertical; }
  .comment-form .fields { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .comment-form .row { display: flex; gap: 8px; }
  .comment-form .row input:first-child { width: 40%; }
  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: var(--accent-2); text-decoration: none; }

  /* Sidebar */
  .sidebar { position: sticky; top: 76px; }
  .download-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, var(--ok), #22c55e);
    color: #06210f; font-weight: 800; font-size: 17px;
    padding: 14px 18px; border-radius: 10px; margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(74,222,128,.25); transition: filter .15s;
  }
  .download-btn:hover { filter: brightness(1.1); text-decoration: none; }
  .download-btn .arrow { font-size: 20px; }
  .steam-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(255,255,255,.05); color: var(--text);
    border: 1px solid var(--border); font-weight: 700; font-size: 14px;
    padding: 12px 18px; border-radius: 10px; margin-bottom: 16px; transition: background .15s;
  }
  .steam-btn:hover { background: rgba(255,255,255,.12); text-decoration: none; }
  .steam-btn .s-ico {
    font-size: 15px; font-weight: 900; color: #66c0f4;
  }
  .info-list { list-style: none; }
  .info-list li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .info-list li:last-child { border-bottom: none; }
  .info-list .k { color: var(--muted); }
  .info-list .v { font-weight: 600; text-align: right; }
  .meta-note {
    margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.5;
    padding: 12px; background: var(--card-2); border-radius: 8px;
  }

  footer {
    text-align: center; color: var(--muted); font-size: 13px;
    padding: 24px; border-top: 1px solid var(--border);
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(5,8,14,.92); z-index: 100;
    display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 82vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .lightbox .cap { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .lb-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(124,108,255,.2); color: #fff; border: 1px solid rgba(124,108,255,.5);
    width: 46px; height: 46px; border-radius: 50%; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background .15s;
  }
  .lb-btn:hover { background: rgba(124,108,255,.45); }
  .lb-prev { left: 24px; }
  .lb-next { right: 24px; }
  .lb-close {
    position: absolute; top: 20px; right: 24px; background: rgba(255,255,255,.1);
    border: 1px solid var(--border); color: #fff; width: 38px; height: 38px;
    border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .lb-close:hover { background: rgba(255,255,255,.22); }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .shots { grid-template-columns: repeat(2, 1fr); }
    .hero img { height: 260px; }
    .hero h1 { font-size: 26px; }
  }
  @media (max-width: 560px) {
    .shots { grid-template-columns: 1fr; }
    .feature-list { grid-template-columns: 1fr; }
    main { padding: 16px 14px 32px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title"><span class="logo" id="logo">◆</span><span id="siteTitle">Mods</span></div>
  <nav class="nav-links">
    <a href="#description">About</a>
    <a href="#gallery">Screenshots</a>
    <a href="#comments">Reviews</a>
    <a href="#" id="headerDownload">Download</a>
  </nav>
</header>

<main>
  <section class="hero">
    <img id="banner" src="" alt="Mod banner">
    <div class="hero-overlay">
      <h1 id="modTitle"></h1>
      <p class="tagline" id="modTagline"></p>
      <div class="badges" id="modBadges"></div>
    </div>
  </section>

  <div class="layout">
    <div class="content">
      <section class="card desc" id="description">
        <h2>About this mod</h2>
        <div id="modDescription"></div>
      </section>

      <section class="card" id="features">
        <h2>Features</h2>
        <ul class="feature-list" id="modFeatures"></ul>
      </section>

      <section class="card" id="install">
        <h2>Installation</h2>
        <ol class="install-list" id="installList"></ol>
      </section>

      <section class="card" id="gallery">
        <h2>Screenshots</h2>
        <div class="shots" id="shotGrid"></div>
      </section>

      <section class="card" id="comments">
        <h2>Ratings &amp; Reviews</h2>
        <div class="ratings-row">
          <div class="score">
            <div class="num" id="scoreNum"></div>
            <div class="stars" id="scoreStars"></div>
            <div class="count" id="scoreCount"></div>
          </div>
          <div class="bars" id="scoreBars"></div>
        </div>
        <div id="commentList"></div>
        <!-- <div class="comment-form">
          <div class="avatar" id="formAvatar"></div>
          <div class="fields">
            <div class="row">
              <input type="text" placeholder="Your name" id="nameInput">
              <input type="text" placeholder="Your avatar (image URL)" id="avatarInput">
            </div>
            <textarea placeholder="Write a comment..." id="bodyInput"></textarea>
            <button class="btn" id="postBtn">Post comment</button>
          </div>
        </div> -->
      </section>
    </div>

    <aside class="sidebar">
      <a class="download-btn" id="downloadBtn" href="#"><span class="arrow">⬇</span> Download</a>
      <a class="steam-btn" id="steamBtn" href="#"></a>
      <div class="card">
        <h2>Mod info</h2>
        <ul class="info-list" id="infoList"></ul>
        <p class="meta-note" id="metaNote"></p>
      </div>
    </aside>
  </div>
</main>

<footer>
  <div id="footerText"></div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-btn lb-prev" id="lbPrev">❮</button>
  <img id="lbImg" src="" alt="Screenshot">
  <button class="lb-btn lb-next" id="lbNext">❯</button>
  <div class="cap" id="lbCap"></div>
</div>

<script>

const CONFIG = {
  siteTitle: "AzrM0ddr Mods",
  siteLogo: "◆",
  footerText: "All mods are fan-made and not affiliated with the original game developers.",

  mod: {
    title: "Adaptive Extraction Overhaul",
    tagline: "Every haul scales with the danger. More monsters, more loot, high risk, high reward",
    banner: "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3241660/1ea445e044a2d5b09cfa8291350b63ebed6e5741/header.jpg",
    game: "REPO",
    tags: ["Adaptive", "Loot", "Difficulty", "Levels"],
    description: [
      "Adaptive Extraction Overhaul reworks R.E.P.O. into a living risk/reward loop. Instead of fixed loot tables, the game watches how you play (squad size, extraction speed, and performance) and scales monster threat and loot value together on one shared difficulty curve. Push into a hotter zone and enemies get meaner, but the caches they guard get richer.",
      "Levels, monsters, and loot all adapt each run. Layouts shift, hazard density changes, and elite packs spawn to protect high-value caches. The result: the deeper you dare, the better you get paid, and every run stays fair enough to still feel like a win when you extract with your life.",
    ],
    features: [
      "Unified threat & loot scaling curve",
      "Squad-size and performance-aware difficulty",
      "Adaptive level layouts and hazard density",
      "Elite packs guarding high-value caches",
      "New signature-tier loot table",
      "Solo & co-op support",
    ],
    install: [
      "Download the latest version with the button above — you'll get a <code>.zip</code> file.",
      "Open <b>r2modman</b> or <b>Thunderstore Mod Manager</b> and select <b>R.E.P.O.</b> as the game.",
      "On the mods page go to <b>Settings</b> and click <b>Import local mod</b> and pick the downloaded ZIP.",
      "Enable <code>AdaptiveExtractionOverhaul</code> in your installed mods, then launch the game.",
    ],
    screenshots: [
      "https://static0.gamerantimages.com/wordpress/wp-content/uploads/2025/03/r-e-p-o-press-image-1.jpg",
      "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/3241660/ss_af7d8d6302d543d89019bad49ea853a970bb82de.1920x1080.jpg",
      "https://uploads.golmedia.net/uploads/articles/article_media/4716260421740999645gol1.jpg",
    ],
    info: {
      "version": "1.2.2",
      "file size": "16 MB",
      "updated": "August 25, 2026",
      "author": "AzrM0ddr",
    },
    downloadUrl: "https://github.com/VerNullr/REPO-AEO-AzrM0ddr/releases/download/test/AEO_Mod.zip",
    downloadLabel: "Download Mod",
    downloadNote: "914  downloads in the first week",
    steamUrl: "https://store.steampowered.com/app/3241660/REPO/",
    steamLabel: "Get REPO on Steam",
  },

  rating: {
    average: 4.5,
    count: 37,
    distribution: { 5: 19, 4: 9, 3: 5, 2: 2, 1: 2 },
  },

  comments: [
    {
      name: "AndehY",
      avatar: "https://api.dicebear.com/9.x/thumbs/svg?seed=Slimer",
      date: "August 27, 2026",
      text: "Ran a full squad of six and the loot value jump once the monster count climbs is wild",
      likes: 2,
    },
    {
      name: "pxlyssa",
      avatar: "https://api.dicebear.com/9.x/thumbs/svg?seed=ClankerGuy",
      date: "August 25, 2026",
      text: "Barely notice any difference in difficulty when solo",
      likes: 0,
    },
  ],
};


const m = CONFIG.mod;
document.title = m.title + " — " + CONFIG.siteTitle;
document.getElementById("siteTitle").textContent = CONFIG.siteTitle;
document.getElementById("logo").textContent = CONFIG.siteLogo;
document.getElementById("footerText").textContent = CONFIG.footerText;
document.getElementById("banner").src = m.banner;
document.getElementById("modTitle").textContent = m.title;
document.getElementById("modTagline").textContent = m.tagline + " · " + m.game;

m.tags.forEach(t => {
  const el = document.createElement("span");
  el.className = "badge";
  el.textContent = t;
  document.getElementById("modBadges").appendChild(el);
});
const gameBadge = document.createElement("span");
gameBadge.className = "badge good";
gameBadge.textContent = m.game;
document.getElementById("modBadges").prepend(gameBadge);

const desc = document.getElementById("modDescription");
m.description.forEach(p => {
  const el = document.createElement("p");
  el.textContent = p;
  desc.appendChild(el);
});

const feat = document.getElementById("modFeatures");
m.features.forEach(f => {
  const li = document.createElement("li");
  li.textContent = f;
  feat.appendChild(li);
});

const steps = document.getElementById("installList");
m.install.forEach(s => {
  const li = document.createElement("li");
  li.innerHTML = s;
  steps.appendChild(li);
});

const shots = document.getElementById("shotGrid");
let lbIndex = 0;
m.screenshots.forEach((src, i) => {
  const div = document.createElement("div");
  div.className = "shot";
  const img = document.createElement("img");
  img.src = src;
  img.alt = "Screenshot " + (i + 1);
  img.loading = "lazy";
  div.appendChild(img);
  div.addEventListener("click", () => openLb(i));
  shots.appendChild(div);
});

const info = document.getElementById("infoList");
for (const [k, v] of Object.entries(m.info)) {
  const li = document.createElement("li");
  li.innerHTML = '<span class="k">' + k + '</span><span class="v">' + v + "</span>";
  info.appendChild(li);
}
const metaNote = document.getElementById("metaNote");
metaNote.textContent = m.downloadNote;

const dl = document.getElementById("downloadBtn");
dl.href = m.downloadUrl;
dl.innerHTML = '<span class="arrow">⬇</span> ' + (m.downloadLabel || "Download");
document.getElementById("headerDownload").href = m.downloadUrl;

const steam = document.getElementById("steamBtn");
if (m.steamUrl) {
  steam.href = m.steamUrl;
  steam.innerHTML = '<span class="s-ico">⬇</span> ' + (m.steamLabel || "View on Steam");
  steam.setAttribute("target", "_blank");
  steam.setAttribute("rel", "noopener");
} else {
  steam.style.display = "none";
}

function starString(ratio) {
  let s = "";
  for (let i = 1; i <= 5; i++) {
    if (ratio >= i - 0.25) s += "★";
    else if (ratio >= i - 0.75) s += "⯨";
    else s += "☆";
  }
  return s;
}
const r = CONFIG.rating;
document.getElementById("scoreNum").textContent = r.average.toFixed(1);
document.getElementById("scoreStars").textContent = starString(r.average);
document.getElementById("scoreCount").textContent = r.count + " ratings";
const bars = document.getElementById("scoreBars");
for (let i = 5; i >= 1; i--) {
  const n = r.distribution[i] || 0;
  const row = document.createElement("div");
  row.className = "bar-row";
  const pct = r.count ? (n / r.count) * 100 : 0;
  row.innerHTML = '<span class="bar-label">' + i + "★</span>" +
    '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
    '<span style="width:36px;text-align:right">' + n + "</span>";
  bars.appendChild(row);
}

const list = document.getElementById("commentList");
function renderComment(c, listEl) {
  const div = document.createElement("div");
  div.className = "comment";
  const shown = c.likes > 0 ? "👍 " + c.likes : "";
  div.innerHTML =
    '<div class="avatar"><img src="' + c.avatar + '" alt="' + c.name + '"></div>' +
    '<div style="flex:1"><div class="meta"><span class="name">' + c.name + "</span><span>" + c.date + "</span></div>" +
    '<div class="body">' + c.text + "</div>" +
    '<div class="like">' + shown + "</div></div>";
  listEl.appendChild(div);
}
CONFIG.comments.forEach(c => renderComment(c, list));

const formAvatar = document.getElementById("formAvatar");
formAvatar.style.display = "flex";
formAvatar.style.alignItems = "center";
formAvatar.style.justifyContent = "center";
formAvatar.innerHTML = '<img src="https://api.dicebear.com/9.x/thumbs/svg?seed=You" alt="you" style="width:100%;height:100%;object-fit:cover">';

document.getElementById("postBtn").addEventListener("click", () => {
  const name = document.getElementById("nameInput").value.trim();
  const text = document.getElementById("bodyInput").value.trim();
  if (!name || !text) return;
  const avatar = document.getElementById("avatarInput").value.trim() ||
    "https://api.dicebear.com/9.x/thumbs/svg?seed=" + encodeURIComponent(name);
  const now = new Date();
  renderComment({
    name: name,
    avatar: avatar,
    date: now.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }),
    text: text,
    likes: 0,
  }, list);
  document.getElementById("nameInput").value = "";
  document.getElementById("avatarInput").value = "";
  document.getElementById("bodyInput").value = "";
});

const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCap = document.getElementById("lbCap");
function openLb(i) {
  lbIndex = i;
  showLb();
  lb.classList.add("open");
}
function showLb() {
  lbImg.src = m.screenshots[lbIndex];
  lbCap.textContent = "Screenshot " + (lbIndex + 1) + " / " + m.screenshots.length;
}
function closeLb() { lb.classList.remove("open"); }
document.getElementById("lbClose").addEventListener("click", closeLb);
document.getElementById("lbPrev").addEventListener("click", () => { lbIndex = (lbIndex - 1 + m.screenshots.length) % m.screenshots.length; showLb(); });
document.getElementById("lbNext").addEventListener("click", () => { lbIndex = (lbIndex + 1) % m.screenshots.length; showLb(); });
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") { lbIndex = (lbIndex - 1 + m.screenshots.length) % m.screenshots.length; showLb(); }
  if (e.key === "ArrowRight") { lbIndex = (lbIndex + 1) % m.screenshots.length; showLb(); }
});
</script>
</body>
</html>
